name: Demo watchdog

# The every-14-minute ping that used to live here moved into Supabase pg_cron
# (backend/apps/core/migrations/0010_keepalive_pg_cron.py). GitHub's free-tier
# cron was the weak link: of ~100 scheduled runs a day it delivered ~20, with
# multi-hour gaps — so Render slept between pings anyway — and GitHub's own
# runner failures emailed false alarms. pg_cron fires on time because it runs
# inside the always-on Supabase Postgres: it GETs /healthz/ every 10 minutes,
# which keeps Render awake, and the handler's indexed read resets Supabase's
# 7-day inactivity timer in the same request. Self-contained loop.
#
# What remains here is the part GitHub is good at — being somewhere else:
#
#   1. `check`: a once-a-day loud probe of the whole loop. It requires both a
#      200 from /healthz/ AND `"keepalive_jobs": 2` in the body (the handler
#      counts the pg_cron jobs), so a broken deploy, a wiped database, or a
#      lost cron schedule all end in an email to the repo owner instead of a
#      silently sleeping demo.
#
#   2. `keepalive`: GitHub disables scheduled workflows after 60 days without
#      repository activity, which would silently kill the daily check. This
#      pushes an empty commit to the orphan `keepalive` branch every ~50 days
#      to reset that timer while leaving main's history clean.

on:
  schedule:
    - cron: '23 14 * * *'   # daily; odd minute to dodge GitHub's :00 cron rush
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

permissions:
  contents: write

env:
  HEALTH_URL: https://songscope.onrender.com/healthz/

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify demo is up and keepalive loop intact
        run: |
          # -m 120 tolerates a cold start in case the pg_cron loop just broke;
          # the retry loop tolerates a transient network blip. A hard failure
          # is intentional: it emails the repo owner.
          for attempt in 1 2 3; do
            status=$(curl -sS -m 120 -o /tmp/body.txt -w '%{http_code}' "$HEALTH_URL" || echo 000)
            echo "attempt $attempt: status $status"
            cat /tmp/body.txt || true
            echo
            if [ "$status" = "200" ] && grep -q '"keepalive_jobs": 2' /tmp/body.txt; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::$HEALTH_URL unhealthy or pg_cron keepalive jobs missing (last status $status)"
          exit 1

  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh repository activity if stale
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin keepalive:refs/remotes/origin/keepalive 2>/dev/null || true
          if git rev-parse --verify -q refs/remotes/origin/keepalive >/dev/null; then
            last=$(git log -1 --format=%ct refs/remotes/origin/keepalive)
          else
            last=0
          fi
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "last keepalive commit: ${age_days}d ago"
          if [ "$age_days" -lt 50 ]; then
            echo "still fresh — nothing to do"
            exit 0
          fi
          # Orphan branch: never merged, keeps main's history free of noise.
          git checkout --orphan keepalive
          git rm -rf --cached . >/dev/null 2>&1 || true
          git commit --allow-empty -m "chore: keepalive ping to preserve scheduled workflows"
          git push --force origin keepalive
